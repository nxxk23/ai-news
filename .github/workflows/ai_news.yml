name: AI News

on:
  workflow_dispatch: 
  schedule:
    # Every 5 minutes during the US market session (12:00–21:00 UTC).
    - cron: '*/5 12-21 * * 1-5'
  repository_dispatch:
      types: [run-news-bot]

jobs:
  run-news-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run News Bot
      env:
        GROQ: ${{ secrets.GROQ }}
        DISCORD_INVEST: ${{ secrets.DISCORD_INVEST }}
        FACEBOOK_FEED_URL: ${{ vars.FACEBOOK_FEED_URL }}
      run: |
        python main.py
